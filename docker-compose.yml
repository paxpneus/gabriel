      - backend

  # ── 10. Deployer ──────────────────────────────────────────────────────────
  # Recebe o webhook do GitHub e roda scripts/deploy.sh (build + blue-green
  # swap + lock). Mantém seu próprio clone do repo (deploy_repo, decoupled de
  # onde o Portainer guarda o checkout da stack) e fala com o daemon do
  # Docker do host via docker.sock - por isso COMPOSE_PROJECT_NAME precisa
  # bater exatamente com o nome da stack no Portainer, senão o deploy cria
  # um segundo project/stack em paralelo em vez de atualizar os containers
  # existentes. Ver README de scripts/deployer/ pra configuração.
  deployer:
    build:
      context: ./scripts/deployer
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      REPO_URL: ${DEPLOY_REPO_URL}
      GIT_BRANCH: ${DEPLOY_GIT_BRANCH:-main}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET}
      DEPLOY_HEALTH_TIMEOUT: ${DEPLOY_HEALTH_TIMEOUT:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_repo:/repo
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  deploy_repo:
  ml_session:
  ml_downloads:
  stock_movement_csv:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
